<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Saling Jaga → Covatom · wajah baru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Fredoka:wght@600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #EEF0E8; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #EEF0E8;
    font-family: "Inter", system-ui, sans-serif; color: #0F1B35; -webkit-font-smoothing: antialiased; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #world > * { position: absolute; }
  #world *, #hud * { box-sizing: border-box; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud > * { position: absolute; }
  .o { font-family: "Outfit", sans-serif; }
  .rb { font-family: "Roboto", sans-serif; }
  .row { display: flex; align-items: center; white-space: nowrap; }
  .ic { display: inline-flex; flex: none; }
  .lay { position: absolute; left: 50%; top: 50%; }
  .lay > * { position: absolute; }
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="hud"></div>
</div>
<script src="../../types/_shared/motion.js"></script>
<script src="film.js"></script>
</body>
</html>
