<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saling Jaga · launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #07110c; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #07110c;
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #f2edd5; -webkit-font-smoothing: antialiased; }
  #bg, #red, #lamp, #rain, #scrim { position: absolute; inset: 0; }
  #bg { background: radial-gradient(900px 1100px at 50% 60%, rgba(27,77,46,.55), transparent 70%),
                    radial-gradient(700px 700px at 100% 0%, rgba(19,39,29,.9), transparent 70%); }
  #lamp { background: radial-gradient(1100px 1000px at 50% 0%, rgba(242,196,107,.32), transparent 70%); opacity: 0; }
  #red { background: radial-gradient(1000px 1200px at 50% 60%, rgba(239,75,75,.55), transparent 72%); opacity: 0; }
  #scrim { background: linear-gradient(180deg, rgba(7,17,12,.92) 0px, rgba(7,17,12,.75) 560px, rgba(7,17,12,0) 760px); opacity: 0; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #world > * { position: absolute; }
  #hud { position: absolute; inset: 0; }
  #hud > * { position: absolute; }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .lbl { font: 600 30px/1 "JetBrains Mono", monospace; letter-spacing: .14em; color: #3cbf6e; text-transform: uppercase;
    display: flex; align-items: center; gap: 18px; white-space: nowrap; }
  .lbl::before { content: ""; width: 40px; height: 4px; background: currentColor; }
  .head { font: 800 100px/1.0 "Plus Jakarta Sans", sans-serif; letter-spacing: -.045em; color: #f2edd5; width: 930px; }
  .head .serif { color: #3cbf6e; font-size: 1.12em; }
  .sub { font: 500 40px/1.35 "Plus Jakarta Sans", sans-serif; color: #a5b0a2; width: 900px; }
  .cur { width: 0; height: 0; z-index: 50; }
  .cur svg { position: absolute; left: -8px; top: -6px; width: 68px; height: 68px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  .cur .pill { position: absolute; left: 44px; top: 60px; font: 700 28px/1 "Plus Jakarta Sans"; padding: 11px 20px; border-radius: 999px; white-space: nowrap; background: #3cbf6e; color: #04140a; }
  .rip { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 5px solid #3cbf6e; box-sizing: border-box; z-index: 49; }
  .av { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; flex: none; }
  .ic { display: inline-flex; flex: none; }
  #world *, #hud * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="lamp"></div>
  <div id="red"></div>
  <svg id="rain" width="1080" height="1920"></svg>
  <div id="world"></div>
  <div id="scrim"></div>
  <div id="hud"></div>
</div>
<script src="../../types/_shared/motion.js"></script>
<script src="film.js"></script>
</body>
</html>
