<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Saling Jaga · Cari keluarga & Mode lansia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #07110c; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #07110c;
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #f2edd5; -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0;
    background: radial-gradient(900px 1000px at 50% 62%, rgba(27,77,46,.45), transparent 70%),
                radial-gradient(700px 600px at 0% 0%, rgba(19,39,29,.9), transparent 70%); }
  #rings { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #world > * { position: absolute; }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  #shape { left: 0; top: 0; overflow: hidden; }
  #logo { position: absolute; left: 50%; top: 50%; }
  .cap { width: 920px; }
  .kick { font: 600 26px/1 "JetBrains Mono", monospace; letter-spacing: .12em; color: #3cbf6e; text-transform: uppercase;
    display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .kick::before { content: ""; width: 30px; height: 2px; background: currentColor; }
  .head { font: 800 76px/1.04 "Plus Jakarta Sans", sans-serif; letter-spacing: -.035em; color: #f2edd5; }
  .head .serif { color: #3cbf6e; font-size: 1.12em; letter-spacing: -.01em; }
  .subs { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
  .sub { font: 500 32px/1.3 "Plus Jakarta Sans", sans-serif; color: #c9cdb9; display: flex; gap: 16px; align-items: flex-start; }
  .sub svg { width: 32px; height: 32px; flex: none; color: #3cbf6e; margin-top: 4px; }
  .sub b { color: #f2edd5; font-weight: 700; }
  .chip { display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; border-radius: 999px; }
  .av { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font: 800 36px/1 "Plus Jakarta Sans"; color: #fff; position: relative; }
  .gbox { border-radius: 34px; box-shadow: inset 0 0 0 2px rgba(242,237,213,.13); background: rgba(7,17,12,.35); }
  .glbl { font: 600 22px/1 "JetBrains Mono"; color: #a5b0a2; letter-spacing: .06em; text-transform: uppercase; }
  .nm { font: 700 24px/1 "Plus Jakarta Sans"; text-align: center; white-space: nowrap; }
  .badge { position: absolute; right: -14px; top: -12px; width: 44px; height: 44px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #0b1811; }
  .wave { display: flex; align-items: center; gap: 6px; }
  .wave i { display: block; width: 7px; border-radius: 4px; background: currentColor; }
  .cur { left: 0; top: 0; width: 0; height: 0; }
  .cur svg { position: absolute; left: -5px; top: -3px; width: 56px; height: 56px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .cur .pill { position: absolute; left: 36px; top: 48px; font: 700 25px/1 "Plus Jakarta Sans";
    padding: 10px 17px; border-radius: 999px; white-space: nowrap; }
  .rip { width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 3px solid #f2edd5; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <svg id="rings" viewBox="0 0 1080 1920"><circle/><circle/><circle/></svg>
  <div id="world"></div>
</div>
<script src="../../types/_shared/motion.js"></script>
<script src="film.js"></script>
</body>
</html>
