<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chalid Ade Rahman · Portfolio</title>
<style>
  @font-face { font-family: "Geist"; src: url("assets/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url("assets/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #f4f4f5; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f4f4f5;
    font-family: "Geist", system-ui, sans-serif; color: #0a0a0a; -webkit-font-smoothing: antialiased; }
  #bg, #night { position: absolute; inset: 0; }
  #bg { background: radial-gradient(1200px 800px at 82% 8%, rgba(37,99,235,.10), transparent 70%),
                    radial-gradient(1000px 800px at 6% 100%, rgba(124,58,237,.07), transparent 70%); }
  #night { background: radial-gradient(1200px 900px at 72% 52%, rgba(27,77,46,.55), transparent 70%), #07110c; opacity: 0; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #world > * { position: absolute; }
  #hud { position: absolute; inset: 0; }
  #hud > * { position: absolute; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  .kick { font: 600 24px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; height: 56px; padding: 0 26px; border-radius: 28px; font: 600 26px/1 "Geist"; white-space: nowrap; }
  .cur { width: 0; height: 0; z-index: 50; }
  .cur svg { position: absolute; left: -6px; top: -5px; width: 52px; height: 52px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.28)); }
  .cur .pill { position: absolute; left: 34px; top: 46px; font: 700 22px/1 "Geist"; padding: 9px 16px; border-radius: 999px; white-space: nowrap; background: #2563eb; color: #fff; }
  .rip { width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; border: 4px solid #2563eb; box-sizing: border-box; z-index: 49; }
  .ic { display: inline-flex; flex: none; }
  .slot { position: relative; display: inline-block; overflow: hidden; vertical-align: top; }
  .strip { position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
  #world *, #hud * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="night"></div>
  <div id="world"></div>
  <div id="hud"></div>
</div>
<script src="../../types/_shared/motion.js"></script>
<script src="film.js"></script>
</body>
</html>
