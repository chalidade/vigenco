<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vigenco · launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #09090B; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #09090B;
    font-family: "Inter Tight", system-ui, sans-serif; color: #F4F2EE; -webkit-font-smoothing: antialiased; }
  #bg, #grid, #warm { position: absolute; inset: 0; }
  #bg { background: radial-gradient(700px 520px at 18% 4%, rgba(138,58,42,.55), transparent 70%),
                    radial-gradient(640px 480px at 82% 6%, rgba(107,42,74,.5), transparent 70%),
                    radial-gradient(800px 700px at 50% 100%, rgba(122,74,28,.28), transparent 70%); }
  #grid { background-image: linear-gradient(rgba(255,255,255,.035) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.035) 2px, transparent 2px);
    background-size: 112px 112px; background-position: -4px 30px;
    -webkit-mask-image: radial-gradient(80% 55% at 50% 45%, #000 30%, transparent 80%); mask-image: radial-gradient(80% 55% at 50% 45%, #000 30%, transparent 80%); }
  #warm { background: radial-gradient(900px 900px at 50% 60%, rgba(255,122,80,.30), transparent 70%); opacity: 0; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #world > * { position: absolute; }
  #hud { position: absolute; inset: 0; }
  #hud > * { position: absolute; }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; color: #FFB25C; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .lbl { font: 500 30px/1 "JetBrains Mono", monospace; letter-spacing: .12em; color: #FFB25C; text-transform: uppercase;
    display: flex; align-items: center; gap: 18px; white-space: nowrap; }
  .lbl::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #FF7A50; }
  .head { font: 700 104px/1.0 "Inter Tight", sans-serif; letter-spacing: -.05em; color: #F4F2EE; width: 940px; }
  .head .serif { font-size: 1.1em; padding-right: .05em; }
  .sub { font: 500 40px/1.35 "Inter Tight", sans-serif; color: #A7A5AE; width: 900px; }
  .cur { width: 0; height: 0; z-index: 50; }
  .cur svg { position: absolute; left: -8px; top: -6px; width: 68px; height: 68px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
  .cur .pill { position: absolute; left: 44px; top: 60px; font: 700 28px/1 "Inter Tight"; padding: 11px 20px; border-radius: 999px; white-space: nowrap; }
  .rip { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 5px solid #FFB25C; box-sizing: border-box; z-index: 49; }
  .ic { display: inline-flex; flex: none; }
  .av { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  #world *, #hud * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grid"></div>
  <div id="warm"></div>
  <div id="world"></div>
  <div id="scrim" style="position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,rgba(9,9,11,.95) 0px,rgba(9,9,11,.85) 520px,rgba(9,9,11,0) 720px)"></div>
  <div id="hud"></div>
</div>
<script src="../../types/_shared/motion.js"></script>
<script src="film.js"></script>
</body>
</html>
