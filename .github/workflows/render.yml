name: Render videos

# Two ways to get an MP4:
#  1. Actions tab → "Render videos" → Run workflow (pick a job file, or "all").
#  2. Push a new or changed file under jobs/ → only those jobs are rendered.
# The MP4s (plus a 1-per-second storyboard) are attached to the run as an artifact.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job file to render (e.g. jobs/vigenco-launch.json), or "all"'
        required: true
        default: jobs/vigenco-launch.json
      quality:
        description: 'draft (fast preview) · standard (60 fps, motion blur) · high (60 fps, 4× motion blur)'
        required: true
        default: standard
        type: choice
        options: [draft, standard, high]
  push:
    branches: [main]
    paths: ['jobs/*.json']

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick jobs
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.job }}" = "all" ]; then
              files=$(ls jobs/*.json)
            else
              files="${{ inputs.job }}"
            fi
            quality="${{ inputs.quality }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
              files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.json' || true)
            else
              files=$(git diff --name-only --diff-filter=AM "$before" HEAD -- 'jobs/*.json')
            fi
            quality=""
          fi
          files=$(echo $files | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"
          echo "Jobs to render: ${files:-none}"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.files != ''
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.files != ''
        with:
          python-version: '3.12'

      - name: Install
        if: steps.pick.outputs.files != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Render
        if: steps.pick.outputs.files != ''
        shell: bash
        run: |
          mkdir -p out
          for f in ${{ steps.pick.outputs.files }}; do
            [ -f "$f" ] || { echo "skip: $f not found"; continue; }
            q="${{ steps.pick.outputs.quality }}"
            node bin/vigenco.mjs render "$f" ${q:+--quality $q} --storyboard
          done
          ls -lh out

      - name: Upload videos
        if: steps.pick.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.storyboard.png
          retention-days: 30
